<div class="bg-white border border-gray-200 rounded-lg p-3 mb-2 shadow-sm transition-all duration-200 cursor-pointer hover:shadow-md"
     [class]="customClass"
     [ngClass]="getPriorityClass()">
  <div class="flex justify-between items-start mb-2">
    <h4 class="text-sm font-semibold m-0 text-gray-800 flex-1 mr-2">{{ item.Title }}</h4>
    <span class="text-xs text-gray-600 font-medium">{{ item.Id }}</span>
  </div>

  <div class="mb-3">
    <p class="text-xs text-gray-700 m-0 leading-relaxed">{{ item.Summary }}</p>
  </div>

  <div class="border-t border-gray-100 pt-2">
    <div class="flex gap-1.5 mb-2 flex-wrap">
      <span class="text-xs px-1.5 py-0.5 rounded font-medium"
            [ngClass]="{
              'bg-red-100 text-red-700': item.Priority === 'Critical',
              'bg-orange-100 text-orange-700': item.Priority === 'High',
              'bg-green-100 text-green-700': item.Priority === 'Normal',
              'bg-blue-100 text-blue-700': item.Priority === 'Low'
            }">
        {{ item.Priority }}
      </span>
      <span class="text-xs bg-gray-100 text-gray-600 px-1.5 py-0.5 rounded font-medium">Rank: {{ item.RankId }}</span>
      <span *ngIf="item.Estimate" class="text-xs bg-purple-100 text-purple-700 px-1.5 py-0.5 rounded font-medium">
        {{ item.Estimate }}h
      </span>
    </div>

    <div class="flex gap-1 flex-wrap" *ngIf="getTagsArray().length > 0">
      <span
        *ngFor="let tag of getTagsArray()"
        class="text-xs bg-gray-100 text-gray-600 px-1.5 py-0.5 rounded-full font-medium"
      >
        {{ tag }}
      </span>
    </div>
  </div>
</div>
