<div class="mb-4" [class]="customClass">
  <div class="flex justify-between items-center px-3 py-2 bg-gray-100 rounded-md cursor-pointer transition-colors duration-200 hover:bg-gray-200 mb-2"
       (click)="toggleCollapsed()">
    <div class="flex items-center gap-2">
      <div class="w-6 h-6 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-semibold">
        {{ getAssigneeInitials() }}
      </div>
      <span class="text-sm font-semibold text-gray-800">{{ group.assignee }}</span>
      <span class="text-xs text-gray-600 font-medium">({{ getItemCount() }})</span>
    </div>
    <div class="transition-transform duration-200 text-gray-600"
         [class.rotate-180]="!group.collapsed"
         [class.-rotate-90]="group.collapsed">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
        <path d="M4.427 7.427l3.396 3.396a.25.25 0 00.354 0l3.396-3.396A.25.25 0 0011.396 7H4.604a.25.25 0 00-.177.427z"/>
      </svg>
    </div>
  </div>

  <div class="group-content" [class.collapsed]="group.collapsed">
    <app-kanban-card
      *ngFor="let item of group.items"
      [item]="item"
    ></app-kanban-card>
  </div>
</div>
