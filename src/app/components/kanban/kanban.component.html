<div class="flex h-full bg-gray-50 p-4 rounded-lg shadow-sm" [class]="props?.class">
  <div class="flex-1 pl-4 kanban-scroll">
    <!-- Header -->
    <div class="flex justify-between items-center mb-5 pb-4 border-b border-gray-200 md:flex-col md:items-start md:gap-3" >
      <h2 class="text-2xl font-semibold text-gray-800 m-0 md:text-xl">
        Kanban Board
      </h2>
      <div class="flex gap-4 md:gap-3">
        <span class="text-sm text-gray-600 bg-gray-100 px-3 py-1.5 rounded-full font-medium">
          {{ getTotalItemCount() }} items
        </span>
        <span class="text-sm text-gray-600 bg-gray-100 px-3 py-1.5 rounded-full font-medium">
          {{ getColumnCount() }} columns
        </span>
      </div>
    </div>

    <!-- Status -->
    <div class="kanban-status flex items-center gap-4 md:gap-3">
      <div class="kanban-status-item flex-1 flex justify-between items-center mb-2 p-2 border-b-2"
        *ngFor="let column of columns"
        [ngClass]="{
          'border-blue-600': column.status === 'Open',
          'border-orange-500': column.status === 'InProgress',
          'border-purple-600': column.status === 'Review',
          'border-green-600': column.status === 'Close'
        }">
        <h3 class="text-base font-semibold m-0"
          [ngClass]="{
            'text-blue-600': column.status === 'Open',
            'text-orange-500': column.status === 'InProgress',
            'text-purple-600': column.status === 'Review',
            'text-green-600': column.status === 'Close'
          }">
          {{ column.status }}
        </h3>
        <span class="bg-gray-300 text-gray-600 text-xs font-semibold px-2 py-1 rounded-full min-w-5 text-center">
          {{ getCardCount(column) }}
        </span>
      </div>
    </div>

    <!-- Assignee and Columns Loop -->
    <div class="space-y-6">
      <div *ngFor="let assignee of assignees" class="!mt-4">
        <!-- Collapsed Assignee -->
        <div class="kanban-assignee flex items-center justify-between text-md text-gray-600 bg-gray-100 px-3 py-2 rounded font-[500] cursor-pointer hover:bg-gray-200"
          (click)="toggleAssigneeCollapsed(assignee.name)">
          <div>{{ assignee.name }} <span class="text-[14px] font-normal">- {{getAssigneeItemCount(assignee.name)}} items</span></div>
          <svg class="ml-2 transition-transform duration-200" width="16" height="16" viewBox="0 0 16 16" fill="currentColor"
            [class.rotate-180]="!assignee.collapsed"
            [class.-rotate-90]="assignee.collapsed">
            <path d="M4.427 7.427l3.396 3.396a.25.25 0 00.354 0l3.396-3.396A.25.25 0 0011.396 7H4.604a.25.25 0 00-.177.427z"/>
          </svg>
        </div>

        <!-- Columns for Current Assignee -->
        <div class="flex gap-4 md:gap-3 mt-2"
          *ngIf="!assignee.collapsed">
          <div class="bg-gray-100 rounded p-3 flex-1 flex flex-col"
            *ngFor="let column of allColumns"
            cdkDropList
            [cdkDropListData]="getAssigneeItems(assignee.name, column.status)"
            [cdkDropListConnectedTo]="getConnectedDropListIds(assignee.name)"
            [id]="getDropListId(assignee.name, column.status)"
            (cdkDropListDropped)="onCardDropped($event, assignee.name, column.status)"
            [ngClass]="{
              'border-b-blue-600': column.status === 'Open',
              'border-b-orange-500': column.status === 'InProgress',
              'border-b-purple-600': column.status === 'Review',
              'border-b-green-600': column.status === 'Close'
            }">
            <!-- List card -->
            <div class="column-content flex-1 overflow-y-auto">
              <div [ngClass]="{ 'border-l-blue-600': column.status === 'Open' }"
                *ngFor="let item of getAssigneeItems(assignee.name, column.status); let i = index"
                cdkDrag>
                <!-- Card -->
                <app-kanban-card [item]="item"></app-kanban-card>
              </div>
              <div class="text-center py-10 px-5 text-gray-600"
                *ngIf="getAssigneeItems(assignee.name, column.status).length === 0">
                <p class="m-0 italic">No items</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Empty State -->
    <div class="flex items-center justify-center flex-1 min-h-96" *ngIf="assignees.length === 0">
      <div class="text-center text-gray-600 max-w-xs">
        <svg class="mb-4 opacity-50 mx-auto" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1" stroke-linecap="round" stroke-linejoin="round" >
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
          <line x1="9" y1="9" x2="15" y2="15" />
          <line x1="15" y1="9" x2="9" y2="15" />
        </svg>
        <h3 class="text-lg font-semibold mb-2 text-gray-800">
          No Data Available
        </h3>
        <p class="text-sm m-0 leading-relaxed">
          Please provide data to display the Kanban board.
        </p>
      </div>
    </div>
  </div>
</div>
