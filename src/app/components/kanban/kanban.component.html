<div class="flex flex-col h-full bg-gray-50 p-4 rounded-lg shadow-sm" [class]="props?.class">
  <div class="flex justify-between items-center mb-5 pb-4 border-b border-gray-200 md:flex-col md:items-start md:gap-3">
    <h2 class="text-2xl font-semibold text-gray-800 m-0 md:text-xl">Kanban Board</h2>
    <div class="flex gap-4 md:gap-3">
      <span class="text-sm text-gray-600 bg-gray-100 px-3 py-1.5 rounded-full font-medium">{{ getTotalItemCount() }} items</span>
      <span class="text-sm text-gray-600 bg-gray-100 px-3 py-1.5 rounded-full font-medium">{{ getColumnCount() }} columns</span>
    </div>
  </div>

  <div class="kanban-columns flex gap-4 overflow-x-auto pb-4 md:gap-3 flex-col md:flex-row sm:overflow-x-visible" *ngIf="columns.length > 0">
    <app-kanban-column
      *ngFor="let column of columns; let i = index"
      [column]="column"
      (groupCollapsedChange)="onGroupCollapsedChange(i, $event)"
    ></app-kanban-column>
  </div>

  <div class="flex items-center justify-center flex-1 min-h-96" *ngIf="columns.length === 0">
    <div class="text-center text-gray-600 max-w-xs">
      <svg class="mb-4 opacity-50 mx-auto" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
        <line x1="9" y1="9" x2="15" y2="15"/>
        <line x1="15" y1="9" x2="9" y2="15"/>
      </svg>
      <h3 class="text-lg font-semibold mb-2 text-gray-800">No Data Available</h3>
      <p class="text-sm m-0 leading-relaxed">Please provide data to display the kanban board.</p>
    </div>
  </div>
</div>
