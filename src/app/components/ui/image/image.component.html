<div [class]="containerClasses">
  <img
    [src]="src"
    [alt]="alt"
    [class]="imageClasses"
    [style]="imageStyles"
    [loading]="loading"
    [attr.aria-label]="ariaLabel"
    [attr.role]="alt ? undefined : 'img'"
    (error)="onError($event)" />
  
  <p
    *ngIf="hasCaption"
    [class]="captionClasses">
    {{ caption }}
  </p>
</div>
