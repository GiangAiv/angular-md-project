<a
  [href]="href"
  [class]="linkClasses"
  [attr.target]="external ? '_blank' : null"
  [attr.rel]="external ? 'noopener noreferrer' : null"
  role="button"
  [attr.aria-label]="ariaLabel">
  <span>{{ text }}</span>
  <span 
    *ngIf="showIcon"
    class="icon-container"
    [class]="iconClasses"
    [innerHTML]="icon"
  ></span>
</a>
