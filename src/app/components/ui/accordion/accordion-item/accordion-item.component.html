<ng-container *ngIf="errors.length > 0; else accordionItemContent">
  <app-inline-error
    inputType="AccordionItem"
    height="52"
    width="100%"
    [error]="errors"
  ></app-inline-error>
</ng-container>

<ng-template #accordionItemContent>
  <div class="accordion-item" [class]="customClass" [class.disabled]="disabled">
    <button
      class="accordion-header"
      [class.expanded]="expanded"
      (click)="toggleExpanded()"
      [disabled]="disabled"
    >
      <ng-container *ngIf="titleTemplate; else defaultTitle">
        <ng-container *ngTemplateOutlet="titleTemplate"></ng-container>
      </ng-container>
      <ng-template #defaultTitle>
        {{ title }}
      </ng-template>
      <i class="accordion-icon" [class.expanded]="expanded">
        <svg viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" class="h-4 w-4 shrink-0 text-base-content-muted transition-transform duration-200"><path fill-rule="evenodd" clip-rule="evenodd" d="M3.13523 6.15803C3.3241 5.95657 3.64052 5.94637 3.84197 6.13523L7.5 9.56464L11.158 6.13523C11.3595 5.94637 11.6759 5.95657 11.8648 6.15803C12.0536 6.35949 12.0434 6.67591 11.842 6.86477L7.84197 10.6148C7.64964 10.7951 7.35036 10.7951 7.15803 10.6148L3.15803 6.86477C2.95657 6.67591 2.94637 6.35949 3.13523 6.15803Z" fill="currentColor"></path></svg>
      </i>
    </button>
    <div class="accordion-content" [class.expanded]="expanded">
      <ng-container *ngIf="contentTemplate; else defaultContent">
        <ng-container *ngTemplateOutlet="contentTemplate"></ng-container>
      </ng-container>
      <ng-template #defaultContent>
        {{ content }}
      </ng-template>
    </div>
  </div>
</ng-template>
