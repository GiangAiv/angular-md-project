<a
  [href]="href"
  [class]="linkClasses"
  [attr.target]="external ? '_blank' : null"
  [attr.rel]="external ? 'noopener noreferrer' : null"
  [attr.aria-label]="ariaLabel">
  
  <!-- Link Text -->
  <span>{{ text }}</span>

  <!-- Icon (if enabled) -->
  <div
    *ngIf="showIcon"
    [class]="iconClasses"
    [innerHTML]="icon">
  </div>
</a>
