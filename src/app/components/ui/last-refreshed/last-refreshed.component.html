<div
  [class]="containerClasses"
  [attr.aria-label]="ariaLabel">
  
  <!-- Clock Icon -->
  <div
    *ngIf="showIcon"
    [class]="iconClasses"
    [innerHTML]="clockIcon">
  </div>

  <!-- Label and Time -->
  <div class="flex gap-1 sm:gap-2">
    <span *ngIf="label">{{ label }}:</span>
    <span [class]="timeClasses">{{ formattedTime }}</span>
  </div>
</div>
