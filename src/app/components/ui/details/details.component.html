<ng-container *ngIf="showContent; else printView">
  <div class="mb-4 mt-2">
    <button
      type="button"
      class="text-sm text-base-content-muted cursor-pointer inline-flex gap-2"
      (click)="toggleOpen()"
    >
      <span [class]="markerClass"></span>
      <span>{{ title }}</span>
    </button>

    <div
      *ngIf="open"
      class="pl-[calc(0.5rem+10px)] pt-3 mb-6 text-sm"
      [@slideAnimation]
    >
      <ng-container *ngIf="props?.children" class="props.class">{{ props?.children }}</ng-container>
      <ng-content *ngIf="!props?.children"></ng-content>
    </div>
  </div>
</ng-container>

<ng-template #printView>
  <div class="mb-4 mt-2 text-base-content-muted">
    <span class="text-sm font-semibold inline-flex">{{ title }}</span>
    <div class="pt-1 mb-6 text-sm">
      <ng-content></ng-content>
    </div>
  </div>
</ng-template>
