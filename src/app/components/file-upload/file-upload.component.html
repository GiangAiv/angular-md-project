<div class="container mx-auto px-4 py-6">
  <h2 class="text-2xl font-bold text-gray-800 mb-4">Upload Markdown File</h2>

  <div
    *ngIf="error"
    class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4"
  >
    {{ error }}
  </div>

  <div class="bg-white shadow-md rounded-lg p-6">
    <div *ngIf="!selectedFile">
      <div
        class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center"
      >
        <p class="mb-4 text-gray-600">Select a Markdown (.md) file to upload</p>
        <label
          class="bg-indigo-600 text-white px-4 py-2 rounded cursor-pointer hover:bg-indigo-700"
        >
          Browse Files
          <input
            type="file"
            class="hidden"
            accept=".md"
            (change)="onFileSelected($event)"
          />
        </label>
      </div>
    </div>

    <div *ngIf="selectedFile">
      <h3 class="font-medium text-lg mb-2">
        Selected file: {{ selectedFile.name }}
      </h3>

      <div class="border rounded p-4 bg-gray-50 mb-4 max-h-96 overflow-auto">
        <pre>{{ fileContent }}</pre>
      </div>

      <div class="flex justify-end space-x-3">
        <button
          (click)="cancel()"
          class="px-4 py-2 border border-gray-300 rounded text-gray-700 hover:bg-gray-50"
        >
          Cancel
        </button>
        <button
          (click)="uploadFile()"
          [disabled]="isLoading"
          class="px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700 disabled:opacity-50"
        >
          {{ isLoading ? "Uploading..." : "Upload" }}
        </button>
      </div>
    </div>
  </div>
</div>
