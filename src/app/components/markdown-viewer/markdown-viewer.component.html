<div class="container mx-auto px-4 py-6">
  <div *ngIf="isLoading" class="text-center py-8">
    <div
      class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-700 mx-auto"
    ></div>
    <p class="mt-2 text-gray-600">Loading file...</p>
  </div>

  <div
    *ngIf="error"
    class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4"
  >
    {{ error }}
  </div>

  <div
    *ngIf="file && !isLoading"
    class="bg-white shadow-md rounded-lg overflow-hidden"
  >
    <div class="p-6">
      <div class="flex justify-between items-start mb-6">
        <div>
          <h2 class="text-2xl font-bold text-gray-800">{{ file.title }}</h2>
          <p class="text-gray-500 text-sm mt-1">
            Created: {{ formatDate(file.createdAt) }} | Updated:
            {{ formatDate(file.updatedAt) }}
          </p>
          <div class="flex flex-wrap gap-2 mt-2">
            <span
              *ngFor="let tag of file.tags"
              class="px-3 py-1 bg-indigo-100 text-indigo-800 text-xs rounded-full"
            >
              {{ tag }}
            </span>
          </div>
        </div>

        <div class="flex space-x-2">
          <button
            (click)="editFile()"
            class="p-2 text-indigo-600 hover:text-indigo-800 transition"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              viewBox="0 0 20 20"
              fill="currentColor"
            >
              <path
                d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"
              />
            </svg>
          </button>
          <button
            (click)="deleteFile()"
            class="p-2 text-red-600 hover:text-red-800 transition"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              viewBox="0 0 20 20"
              fill="currentColor"
            >
              <path
                fill-rule="evenodd"
                d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z"
                clip-rule="evenodd"
              />
            </svg>
          </button>
        </div>
      </div>

      <div class="border-t pt-4">
        <div class="border-t pt-4">
          <!-- Use app-md-renderer with parsedContent instead of app-markdown-renderer -->
          <app-md-renderer
            [parsedContent]="parsedMarkdownContent"
          ></app-md-renderer>
        </div>
      </div>

      <div class="flex justify-between mt-6 pt-4 border-t">
        <button
          (click)="goBack()"
          class="px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 flex items-center"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5 mr-1"
            viewBox="0 0 20 20"
            fill="currentColor"
          >
            <path
              fill-rule="evenodd"
              d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z"
              clip-rule="evenodd"
            />
          </svg>
          Back to List
        </button>
      </div>
    </div>
  </div>
</div>
