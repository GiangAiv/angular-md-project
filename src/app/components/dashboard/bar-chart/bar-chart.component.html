<div class="chart-container">
  <div
    class="chart-canvas-wrapper"
    [style.height.px]="props?.chartAreaHeight || 300"
  >
    <canvas #chartCanvas></canvas>
  </div>
  <div *ngIf="props?.downloadableImage" class="chart-actions">
    <button class="download-btn" (click)="downloadImage()">
      Download Chart
    </button>
  </div>
</div>
