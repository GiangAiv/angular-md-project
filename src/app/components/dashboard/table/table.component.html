<div class="table-container">
  <h3 *ngIf="props?.title" class="table-title">{{ props?.title }}</h3>
  <div class="table-wrapper">
    <table
      [class.striped]="props?.striped !== false"
      [class.bordered]="props?.bordered === true"
    >
      <thead>
        <tr>
          <th
            *ngFor="let column of props?.columns"
            [class.sortable]="props?.sortable !== false"
            (click)="sort(column.accessor)"
          >
            {{ column.header }}
            <span *ngIf="props?.sortable !== false" class="sort-icon">
              {{ getSortIcon(column.accessor) }}
            </span>
          </th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of displayData">
          <td *ngFor="let column of props?.columns">
            {{ row[column.accessor] }}
          </td>
        </tr>
        <tr *ngIf="!displayData || displayData.length === 0">
          <td [attr.colspan]="props?.columns?.length || 1" class="no-data">
            No data available
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="props?.pagination" class="pagination">
    <button
      [disabled]="currentPage === 1"
      (click)="prevPage()"
      class="pagination-btn"
    >
      Previous
    </button>
    <span class="pagination-info"
      >Page {{ currentPage }} of {{ totalPages }}</span
    >
    <button
      [disabled]="currentPage === totalPages"
      (click)="nextPage()"
      class="pagination-btn"
    >
      Next
    </button>
  </div>
</div>
