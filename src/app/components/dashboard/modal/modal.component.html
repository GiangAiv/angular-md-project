<!-- Trigger Button -->
<div class="inline-flex w-fit max-w-full flex-col mt-2 mb-4 ml-0 mr-2">
  <button
    (click)="isOpen()"
    class="rounded-md shadow-sm overflow-auto h-8 border
    flex-none py-1 font-medium px-3 text-xs truncate
    border-base-300
    hover:bg-base-200 focus:z-10 focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-base-300 z-0 bg-base-100"
  >
    {{ props.buttonText }}
  </button>
</div>

<!-- Modal Content -->
<ng-template #modalContainer>
  <div *ngIf="props.open || closing" [class]="modalClasses">
    <div class="fixed inset-0 bg-black/80 z-[9998]" (click)="isOpen()"></div>
    <div class="relative bg-white border border-base-300 bg-base-100 w-4/5 max-w-lg mx-auto rounded-lg shadow-lg z-[9999] overflow-y-auto font-ui">
      <div [class]="titleClasses">
        <ng-container *ngIf="props.title.trim() !== ''">
          {{ props.title }}
          <button
            class="flex items-center justify-center border-none text-base hover:bg-base-200 mt-1"
            (click)="isOpen()"
          >
            <i class="w-4 h-4">×</i>
          </button>
        </ng-container>
        <ng-container *ngIf="props.title.trim() === ''">
          <button
            class="flex items-center justify-center border-none p-0.5 absolute right-0 top-0 ml-4"
            (click)="isOpen()"
          >
            <i class="w-4 h-4 mt-2 mr-2 text-base hover:bg-base-200">×</i>
          </button>
        </ng-container>
      </div>
      <div [class]="contentClasses">
        {{ props.innerText }}
        <ng-content></ng-content>
      </div>
    </div>
  </div>
</ng-template>
