<div class="card" [ngStyle]="{ 'border-color': props?.color || '#0070f3' }">
  <div
    class="card-header"
    [ngStyle]="{
      'background-color': props?.color ? props.color + '14' : '#0070f314',
    }"
  >
    <h3 class="card-title">{{ props?.title }}</h3>
  </div>
  <div class="card-body">
    <div class="card-value">{{ props?.value }}</div>
    <div class="card-description">
      {{ props?.description }}
      <span *ngIf="props?.trend === 'up'" class="trend up">↑</span>
      <span *ngIf="props?.trend === 'down'" class="trend down">↓</span>
    </div>
  </div>
</div>
