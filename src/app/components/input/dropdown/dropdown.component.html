<div [class]="getContainerClasses()">
  <!-- Dropdown Button -->
  <button
    type="button"
    [class]="getButtonClasses()"
    [attr.aria-expanded]="isOpen"
    [attr.aria-haspopup]="true"
    [disabled]="props?.disabled"
    (click)="toggleDropdown()">

    <!-- Selected Value / Placeholder -->
    <span class="flex-1 text-left truncate">{{ getSelectedLabel() }}</span>

    <!-- Chevron Icon -->
    <svg
      class="w-5 h-5 text-gray-400 transition-transform duration-150"
      [class.rotate-180]="isOpen"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 20 20"
      fill="currentColor">
      <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd" />
    </svg>
  </button>

  <!-- Options Menu -->
  <div
    *ngIf="isOpen"
    class="absolute z-10 w-full mt-1 bg-white border border-gray-100 rounded-md shadow-lg max-h-60 overflow-auto focus:outline-none"
    role="listbox"
    [attr.aria-activedescendant]="highlightedIndex >= 0 ? 'option-' + highlightedIndex : undefined">

    <!-- Options List -->
    <div class="py-1">
      <div
        *ngFor="let option of props?.options; let i = index"
        role="option"
        [class]="getOptionClasses(option, i)"
        [attr.aria-selected]="option.value === props?.selected"
        (click)="selectOption(option)"
        (mouseenter)="highlightedIndex = i"
        class="flex items-center"
      >
        <span
          class="mr-2 flex items-center transition-opacity duration-150"
          [style.opacity]="option.value === props?.selected ? 1 : 0"
        >
          <svg viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" class="h-4 w-4">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M11.4669 3.72684C11.7558 3.91574 11.8369 4.30308 11.648 4.59198L7.39799 11.092C7.29783 11.2452 7.13556 11.3467 6.95402 11.3699C6.77247 11.3931 6.58989 11.3355 6.45446 11.2124L3.70446 8.71241C3.44905 8.48022 3.43023 8.08494 3.66242 7.82953C3.89461 7.57412 4.28989 7.55529 4.5453 7.78749L6.75292 9.79441L10.6018 3.90792C10.7907 3.61902 11.178 3.53795 11.4669 3.72684Z" fill="currentColor"></path>
          </svg>
        </span>
        <span>{{ option.label }}</span>
      </div>

      <!-- Empty State -->
      <div
        *ngIf="!props?.options?.length"
        class="px-4 py-2 text-sm text-gray-500 text-center">
        No options available
      </div>
    </div>
  </div>
</div>
