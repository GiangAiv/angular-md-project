<div [class]="getContainerClasses()">
  <div [class]="getGridClasses()" [style.grid-template-columns]="'repeat(' + (props?.dimensions?.length || 1) + ', 1fr)'">
    <!-- Column for each dimension -->
    <div
      *ngFor="let columnData of columnsData"
      [class]="getColumnClasses()">

      <!-- Column Header -->
      <h3 [class]="getColumnHeaderClasses()">
        {{ columnData.dimension }}
      </h3>

      <!-- Rows for this dimension -->
      <div
        *ngFor="let rowData of columnData.data"
        [class]="getRowClasses()">

        <!-- Progress Bar Background -->
        <div
          [class]="getProgressBarClasses()"
          [style.width.%]="rowData.percentage">
        </div>

        <!-- Row Content -->
        <div [class]="getRowContentClasses()">
          <span [class]="getValueLabelClasses()" [title]="rowData.value">
            {{ rowData.value }}
          </span>
          <span [class]="getTotalClasses()">
            {{ formatValue(rowData.total) }}
          </span>
        </div>
      </div>

      <!-- Empty state for this column -->
      <div
        *ngIf="!columnData.data?.length"
        class="text-center py-8 text-gray-500 text-sm">
        No data available
      </div>
    </div>
  </div>

  <!-- Empty state for entire component -->
  <div
    *ngIf="!columnsData?.length"
    class="text-center py-12 text-gray-500">
    <p class="text-lg font-medium">No data available</p>
    <p class="text-sm mt-1">Please provide rows, metrics, and dimensions to display data.</p>
  </div>
</div>
