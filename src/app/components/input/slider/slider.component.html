<div [class]="getContainerClasses()">
  <input
    type="range"
    [class]="getSliderClasses()"
    [style.background]="
      'linear-gradient(to right, black 0%, black ' +
      (((currentValue - (props?.min ?? 0)) / ((props?.max ?? 100) - (props?.min ?? 0))) * 100) +
      '%, #e5e7eb ' +
      (((currentValue - (props?.min ?? 0)) / ((props?.max ?? 100) - (props?.min ?? 0))) * 100) +
      '%, #e5e7eb 100%)'
    "
    [min]="props?.min"
    [max]="props?.max"
    [step]="props?.step"
    [value]="currentValue"
    [disabled]="props?.disabled"
    (input)="onInput($event)"
    aria-label="Slider"
    role="slider"
    [attr.aria-valuemin]="props?.min"
    [attr.aria-valuemax]="props?.max"
    [attr.aria-valuenow]="currentValue"
    [attr.aria-disabled]="props?.disabled" />
  
  <span
    *ngIf="props?.showValue"
    [class]="getValueClasses()"
    aria-hidden="true">
    {{ formatValue(currentValue) }}
  </span>
</div>
