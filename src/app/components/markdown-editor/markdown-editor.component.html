<div class="container mx-auto px-4 py-6">
  <div class="mb-6">
    <h2 class="text-2xl font-bold text-gray-800">
      {{ isEditMode ? "Edit" : "Create" }} Markdown File
    </h2>
  </div>

  <div *ngIf="isLoading" class="text-center py-8">
    <div
      class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-700 mx-auto"
    ></div>
    <p class="mt-2 text-gray-600">Loading file...</p>
  </div>

  <div
    *ngIf="error"
    class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4"
  >
    {{ error }}
  </div>

  <form [formGroup]="editorForm" (ngSubmit)="onSubmit()" *ngIf="!isLoading">
    <div class="bg-white shadow-md rounded-lg overflow-hidden">
      <div class="p-6">
        <div class="mb-4">
          <label for="title" class="block text-sm font-medium text-gray-700"
            >Title</label
          >
          <input
            type="text"
            id="title"
            formControlName="title"
            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500"
            placeholder="Enter title"
          />
          <div
            *ngIf="
              editorForm.get('title')?.invalid &&
              editorForm.get('title')?.touched
            "
            class="text-red-500 text-sm mt-1"
          >
            Title is required
          </div>
        </div>

        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700">Tags</label>
          <div class="flex items-center">
            <input
              type="text"
              [(ngModel)]="tagInput"
              [ngModelOptions]="{ standalone: true }"
              class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500"
              placeholder="Add a tag"
              (keyup.enter)="addTag()"
            />
            <button
              type="button"
              (click)="addTag()"
              class="ml-2 px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700"
            >
              Add
            </button>
          </div>

          <div class="flex flex-wrap gap-2 mt-2">
            <span
              *ngFor="let tag of editorForm.get('tags')?.value"
              class="px-3 py-1 bg-indigo-100 text-indigo-800 text-sm rounded-full flex items-center"
            >
              {{ tag }}
              <button
                type="button"
                (click)="removeTag(tag)"
                class="ml-2 text-indigo-500 hover:text-indigo-700"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-4 w-4"
                  viewBox="0 0 20 20"
                  fill="currentColor"
                >
                  <path
                    fill-rule="evenodd"
                    d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                    clip-rule="evenodd"
                  />
                </svg>
              </button>
            </span>
          </div>
        </div>

        <div class="mb-4">
          <div class="flex justify-between items-center">
            <label for="content" class="block text-sm font-medium text-gray-700"
              >Content</label
            >
            <button
              type="button"
              (click)="togglePreview()"
              class="text-sm text-indigo-600 hover:text-indigo-800"
            >
              {{ previewMode ? "Edit Mode" : "Preview Mode" }}
            </button>
          </div>

          <div *ngIf="!previewMode">
            <textarea
              id="content"
              formControlName="content"
              rows="20"
              class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 font-mono"
              placeholder="Enter markdown content"
            ></textarea>
            <div
              *ngIf="
                editorForm.get('content')?.invalid &&
                editorForm.get('content')?.touched
              "
              class="text-red-500 text-sm mt-1"
            >
              Content is required
            </div>
          </div>

          <div
            *ngIf="previewMode"
            class="mt-2 p-4 border rounded-md bg-gray-50"
          >
            <markdown
              [data]="editorForm.get('content')?.value || ''"
            ></markdown>
          </div>
        </div>

        <div class="flex justify-end space-x-3">
          <button
            type="button"
            (click)="cancel()"
            class="px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
          >
            Cancel
          </button>
          <button
            type="submit"
            [disabled]="editorForm.invalid || isSubmitting"
            class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-50"
          >
            {{ isSubmitting ? "Saving..." : "Save" }}
          </button>
        </div>
      </div>
    </div>
  </form>
</div>
