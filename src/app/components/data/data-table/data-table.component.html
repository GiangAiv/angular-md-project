<!-- Search Input -->
<div *ngIf="props?.searchable" class="mb-4">
  <div class="relative w-max">
    <input
      type="text"
      [(ngModel)]="searchTerm"
      (ngModelChange)="onSearchChange()"
      [placeholder]="props?.searchPlaceholder || 'Search...'"
      class="w-full px-3 py-2 pl-10 pr-4 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-gray-500 focus:border-transparent"
    />
    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
      <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
      </svg>
    </div>
  </div>
</div>

<div class="w-full overflow-x-auto">
  <table [class]="getTableClasses()" role="grid">
    <!-- Table Header -->
    <thead [class]="getHeaderClasses()">
      <tr>
        <th
          *ngFor="let column of props?.columns"
          [class]="getHeaderCellClasses()"
          [attr.aria-sort]="getSortDirection(column.key)"
          [attr.aria-label]="getSortAriaLabel(column.key)"
          (click)="handleSort(column.key)"
          scope="col"
        >
          <div class="flex items-center gap-2 text-sm">
            {{ column.label }}
            <span *ngIf="props?.sortable" class="text-gray-400 text-sm">
              {{ getSortIcon(column.key) }}
            </span>
          </div>
        </th>
      </tr>
    </thead>

    <!-- Table Body -->
    <tbody>
      <tr
        *ngFor="let row of props?.rows; let i = index"
        [class]="getRowClasses(i)"
      >
        <td
          *ngFor="let column of props?.columns"
          [class]="getCellClasses()"
        >
        <div [class]="getCellContentClasses(row[column.key], column)">
          {{ formatCellValue(row[column.key], column) }}
          <span  *ngIf="column.format?.showArrow" [class]="getArrowClasses(row[column.key])"></span>
        </div>
        </td>
      </tr>

      <!-- Empty State -->
      <tr *ngIf="!props?.rows?.length">
        <td
          [attr.colspan]="props?.columns?.length"
          class="px-4 py-8 text-center text-gray-500"
        >
          No data available
        </td>
      </tr>
    </tbody>

    <!-- Total Row -->
    <tfoot *ngIf="shouldShowTotalRow">
      <tr [class]="getTotalRowClasses()">
        <td
          *ngFor="let column of props?.columns"
          [class]="getCellClasses()"
        >
        <div [class]="getTotalCellContentClasses(calculateColumnTotal(column), column)">
          {{ formatCellValue(calculateColumnTotal(column), column) }}
          <span  *ngIf="column.format?.showArrow" [class]="getArrowClasses(calculateColumnTotal(column))"></span>
        </div>
        </td>
      </tr>
    </tfoot>
  </table>
</div>

<!-- Pagination -->
<div *ngIf="props?.paginated && totalPages > 1" class="mt-4 flex items-center justify-between">
  <!-- Items info -->
  <div class="text-sm text-gray-700">
    Showing {{ startItem }} to {{ endItem }} of {{ totalItems }} results
  </div>

  <!-- Pagination controls -->
  <div class="flex items-center space-x-2 text-xs">
    <!-- Previous button -->
      <button
      type="button"
      (click)="goToFirst()"
      [disabled]="!canGoPrevious"
      class="px-1 py-1 border-none  rounded-md hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed"
    >
      <<
    </button>

    <button
      type="button"
      (click)="goToPrevious()"
      [disabled]="!canGoPrevious"
      class="px-1 py-1  border-none  rounded-md hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed"
    >
      <
    </button>

    <!-- Page numbers -->
    <div class="flex items-center space-x-1">
      Page {{ currentPage }} / {{ totalPages }}
    </div>

    <!-- Next button -->
    <button
      type="button"
      (click)="goToNext()"
      [disabled]="!canGoNext"
      class="px-1 py-1  border-none rounded-md hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed"
    >
      >
    </button>
    <button
      type="button"
      (click)="goToLast()"
      [disabled]="!canGoNext"
      class="px-1 py-1  border-none rounded-md hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed"
    >
      >>
    </button>
  </div>
</div>
