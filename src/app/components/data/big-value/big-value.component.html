<div [class]="getContainerClasses()" [attr.data-big-value]="formatValue(props?.value)">
  <!-- Main Value -->
  <div class="text-5xl font-bold tracking-tight md:text-6xl" role="text" [attr.aria-label]="'Value: ' + formatValue(props?.value)">
    {{ formatValue(props?.value) }}
  </div>

  <!-- Label -->
  <div *ngIf="props?.label" class="text-sm font-medium text-gray-600" role="text" [attr.aria-label]="'Label: ' + props?.label">
    {{ props?.label }}
  </div>

 
  <!-- Delta -->
  <div *ngIf="props?.delta" [class]="getDeltaClasses()" role="text" [attr.aria-label]="'Change: ' + props?.delta">
    {{ props?.delta }}
  </div>
</div>
