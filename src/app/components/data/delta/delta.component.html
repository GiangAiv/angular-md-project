<div 
  [class]="getContainerClasses()"
  [attr.aria-label]="getAriaLabel()"
  role="text"
>
  <span class="whitespace-nowrap">
    {{ getPrefix() }}{{ getFormattedValue() }}
  </span>
  <span 
    *ngIf="props?.showArrow !== false"
    class="flex-shrink-0"
    [innerHTML]="getArrowIcon() | safeHtml"
  ></span>
</div>
