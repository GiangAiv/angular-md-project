<div class="border-b border-gray-200">
  <button
    (click)="toggle()"
    class="flex w-full items-center justify-between py-4 text-left font-medium transition-all hover:text-gray-900"
    [class.py-0]="compact"
  >
    <div class="flex items-center gap-2">
      <ng-container *ngIf="titleTemplate; else defaultTitle">
        <ng-container *ngTemplateOutlet="titleTemplate"></ng-container>
      </ng-container>
      <ng-template #defaultTitle>
        {{ title }}
        <span *ngIf="description" class="ml-2 text-gray-500">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" />
          </svg>
        </span>
      </ng-template>
    </div>
    <svg
      class="h-5 w-5 transform transition-transform"
      [class.rotate-180]="expanded"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 20 20"
      fill="currentColor"
    >
      <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
    </svg>
  </button>
  <div
    class="overflow-hidden transition-all"
    [class.max-h-0]="!expanded"
    [class.max-h-[1000px]]="expanded"
  >
    <div class="pb-4">
      <ng-content></ng-content>
    </div>
  </div>
</div>
