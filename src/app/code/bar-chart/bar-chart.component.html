<div class="bg-white rounded-lg shadow-sm mb-6 overflow-hidden p-6">
  <div class="relative w-full" [style.height.px]="chartAreaHeight || 300">
    <canvas #chartCanvas></canvas>
  </div>
  <div *ngIf="downloadableImage" class="flex justify-end mt-4 pt-2 border-t border-gray-100">
    <button 
      (click)="downloadImage()" 
      class="bg-slate-100 hover:bg-slate-200 border border-gray-200 rounded px-3 py-2 text-sm transition-colors duration-200"
    >
      Download Chart
    </button>
  </div>
</div>
